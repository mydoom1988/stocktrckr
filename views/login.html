<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · stocktrckr</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <form class="login-card" method="post" action="/login">
        <span class="login-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <div>
          <p class="eyebrow">Private portfolio</p>
          <h1>stocktrckr</h1>
        </div>
        {{error}}
        <!-- Password managers need a username field to save the password; the server ignores it. -->
        <input class="visually-hidden" type="text" name="username" value="stocktrckr" autocomplete="username" tabindex="-1" aria-hidden="true" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus {{disabled}} />
        <input type="hidden" name="next" value="{{next}}" />
        <button type="submit" {{disabled}}>Sign in</button>
      </form>
    </main>
  </body>
</html>
