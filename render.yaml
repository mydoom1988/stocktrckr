services:
  - type: web
    name: stocktrckr
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # The login password: Render asks for it when the Blueprint is created.
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Optional data providers; the app works without them.
      - key: FMP_API_KEY
        sync: false
      - key: BIGDATA_API_KEY
        sync: false
